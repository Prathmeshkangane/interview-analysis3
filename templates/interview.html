<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview in Progress - AI Mock Interview</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="interview-page">
    <div class="interview-container">
        <!-- Left Panel: Video and Question -->
        <div class="left-panel">
            <!-- Video Section -->
            <div class="video-section">
                <video id="videoElement" autoplay muted></video>
                <div class="video-status" id="videoStatus">
                    <!-- <span id="recordingIndicator" class="hidden">🔴 Recording</span> -->
                    <div id="recordingIndicator" class="hidden">
                        🔴 Recording...
                    </div>
                </div>
            </div>

            <!-- Question Display -->
            <div class="question-display">
                <div class="question-header">
                    <span class="question-number" id="questionNumber">Question 1 of 20</span>
                    <span class="question-category" id="questionCategory">Behavioral</span>
                </div>
                <div class="question-text" id="questionText">
                    Loading question...
                </div>
                <div class="question-focus" id="questionFocus"></div>
            </div>
        </div>

        <!-- Right Panel: Controls and Transcript -->
        <div class="right-panel">
            <div class="controls-section">
                <h3>Interview Controls</h3>

                <!-- Recording Controls -->
                <div class="recording-controls">
                    <button id="startRecording" class="btn-record" disabled>
                        🎤 Start Recording
                    </button>
                    <button id="stopRecording" class="btn-stop" disabled style="display: none;">
                        ⏹️ Stop Recording
                    </button>
                    <div class="recording-timer" id="recordingTimer">00:00</div>
                </div>

                <div class="status-message" id="statusMessage">
                    Loading interview...
                </div>

                <!-- Transcript Display -->
                <div class="transcript-section">
                    <h4>Your Answer:</h4>
                    <div id="transcript" class="transcript-box">
                        <em>Your answer will appear here as you speak...</em>
                    </div>
                    <div id="wordCount" class="word-count">Words: 0</div>
                </div>

                <!-- Submit Button -->
                <button id="submitAnswer" class="btn-submit" disabled style="display: none;">
                    Submit Answer & Continue
                </button>

                <!-- Feedback Display -->
                <div id="feedbackSection" class="feedback-section" style="display: none;">
                    <h4>Quick Feedback:</h4>
                    <div class="score-display">
                        Score: <span id="answerScore">0</span>/100
                    </div>
                    <ul id="feedbackList"></ul>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progressText">0 of 20 questions completed</div>
            </div>
        </div>
    </div>

    <script>
        const sessionId = '{{ session_id }}';
        let mediaRecorder;
        let audioChunks = [];
        let recordingStartTime;
        let timerInterval;
        let currentTranscript = '';
        let recognition;

        // Initialize Speech Recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interimTranscript += transcript;
                    }
                }

                if (finalTranscript) {
                    currentTranscript += finalTranscript;
                }

                const fullText = currentTranscript + interimTranscript;
                document.getElementById('transcript').textContent = fullText || 'Listening...';

                // Update word count
                const wordCount = fullText.trim().split(/\s+/).filter(w => w.length > 0).length;
                document.getElementById('wordCount').textContent = `Words: ${wordCount}`;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                if (event.error === 'no-speech') {
                    document.getElementById('transcript').innerHTML = '<em>No speech detected. Please try again.</em>';
                }
            };
        } else {
            alert('Speech recognition is not supported in your browser. Please use Chrome or Edge.');
        }

        // Initialize video
        async function initVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });
                document.getElementById('videoElement').srcObject = stream;
                document.getElementById('videoStatus').textContent = '✅ Camera Ready';

                // Load first question
                loadQuestion();
            } catch (error) {
                console.error('Error accessing camera:', error);
                document.getElementById('videoStatus').textContent = '❌ Camera Error';
                alert('Please allow camera and microphone access to continue.');
            }
        }

        // Load current question
        async function loadQuestion() {
            try {
                document.getElementById('statusMessage').textContent = 'Loading question...';

                const response = await fetch(`/api/get-question/${sessionId}`);
                const data = await response.json();

                if (data.completed) {
                    // Interview complete
                    window.location.href = `/results/${sessionId}`;
                    return;
                }

                // Display question
                document.getElementById('questionNumber').textContent =
                    `Question ${data.question_number} of ${data.total_questions}`;
                document.getElementById('questionCategory').textContent =
                    data.category.toUpperCase().replace('_', ' ');
                document.getElementById('questionText').textContent = data.question;
                document.getElementById('questionFocus').textContent =
                    `Focus: ${data.focus_area}`;

                // Update progress
                const progress = ((data.question_number - 1) / data.total_questions) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('progressText').textContent =
                    `${data.question_number - 1} of ${data.total_questions} questions completed`;

                // Enable recording button
                document.getElementById('startRecording').disabled = false;
                document.getElementById('statusMessage').textContent = 'Ready to record your answer';

                // Speak the question using text-to-speech
                speakQuestion(data.question);

            } catch (error) {
                console.error('Error loading question:', error);
                document.getElementById('statusMessage').textContent = 'Error loading question';
            }
        }

        // Text-to-speech for question
        function speakQuestion(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;
                speechSynthesis.speak(utterance);
            }
        }

        // Start recording
        // document.getElementById('startRecording').addEventListener('click', async () => {
        const startBtn = document.getElementById('startRecording');

        if (startBtn) {
            startBtn.addEventListener('click', async () => {
                // existing recording logic
            });
        }

        try {
            // Reset transcript
            currentTranscript = '';
            document.getElementById('transcript').textContent = 'Listening...';
            document.getElementById('wordCount').textContent = 'Words: 0';
            document.getElementById('feedbackSection').style.display = 'none';

            // Start speech recognition
            if (recognition) {
                recognition.start();
            }

            // Update UI
            document.getElementById('startRecording').style.display = 'none';
            document.getElementById('stopRecording').style.display = 'block';
            document.getElementById('stopRecording').disabled = false;
            document.getElementById('recordingIndicator').classList.remove('hidden');
            document.getElementById('statusMessage').textContent = '🎤 Recording... Speak your answer clearly';

            // Start timer
            recordingStartTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);

        } catch (error) {
            console.error('Error starting recording:', error);
            alert('Error starting recording: ' + error.message);
        }


        // Stop recording
        document.getElementById('stopRecording').addEventListener('click', () => {
            // Stop speech recognition
            if (recognition) {
                recognition.stop();
            }

            // Stop timer
            clearInterval(timerInterval);

            // Update UI
            document.getElementById('stopRecording').style.display = 'none';
            document.getElementById('recordingIndicator').classList.add('hidden');
            document.getElementById('statusMessage').textContent = 'Processing your answer...';

            // Show submit button
            if (currentTranscript.trim().length > 0) {
                document.getElementById('submitAnswer').style.display = 'block';
                document.getElementById('submitAnswer').disabled = false;
                document.getElementById('statusMessage').textContent = 'Review your answer and click Submit';
            } else {
                document.getElementById('statusMessage').textContent = 'No speech detected. Please try again.';
                document.getElementById('startRecording').style.display = 'block';
                document.getElementById('startRecording').disabled = false;
            }
        });

        // Submit answer
        document.getElementById('submitAnswer').addEventListener('click', async () => {
            const answer = currentTranscript.trim();

            if (!answer) {
                alert('Please record an answer first');
                return;
            }

            document.getElementById('submitAnswer').disabled = true;
            document.getElementById('statusMessage').textContent = 'Analyzing your answer...';

            try {
                const duration = (Date.now() - recordingStartTime) / 1000;

                const response = await fetch(`/api/submit-answer/${sessionId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        answer: answer,
                        duration: duration
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Show feedback
                    document.getElementById('answerScore').textContent = data.score.toFixed(1);
                    const feedbackList = document.getElementById('feedbackList');
                    feedbackList.innerHTML = '';
                    data.feedback.forEach(fb => {
                        const li = document.createElement('li');
                        li.textContent = fb;
                        feedbackList.appendChild(li);
                    });
                    document.getElementById('feedbackSection').style.display = 'block';

                    // Wait 3 seconds then move to next question
                    document.getElementById('statusMessage').textContent = 'Loading next question...';
                    setTimeout(() => {
                        if (data.is_complete) {
                            window.location.href = `/results/${sessionId}`;
                        } else {
                            // Reset for next question
                            document.getElementById('submitAnswer').style.display = 'none';
                            document.getElementById('startRecording').style.display = 'block';
                            document.getElementById('recordingTimer').textContent = '00:00';
                            loadQuestion();
                        }
                    }, 3000);
                } else {
                    alert('Error submitting answer: ' + (data.error || 'Unknown error'));
                    document.getElementById('submitAnswer').disabled = false;
                }
            } catch (error) {
                console.error('Error submitting answer:', error);
                alert('Error submitting answer: ' + error.message);
                document.getElementById('submitAnswer').disabled = false;
            }
        });

        // Update recording timer
        function updateTimer() {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('recordingTimer').textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // Initialize on page load
        window.addEventListener('load', () => {
            initVideo();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (recognition) {
                recognition.stop();
            }
        });
    </script>
</body>

</html>
